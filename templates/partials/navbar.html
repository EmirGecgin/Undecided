<nav class="navbar">
    <a href="{% url 'polls:home' %}" class="navbar-logo">Kararsızım</a>
    <div class="navbar-actions">
        <a href="{% url 'polls:create' %}" class="btn btn-primary">Anket Aç</a>
        {% if user.is_authenticated %}
            <a href="{% url 'polls:profile' user.username %}" class="navbar-username">@{{ user.username }}</a>
            <form method="post" action="{% url 'accounts:logout' %}" class="navbar-logout-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-link">Çıkış</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Giriş</a>
            <a href="{% url 'accounts:register' %}">Kayıt</a>
        {% endif %}
    </div>
</nav>
